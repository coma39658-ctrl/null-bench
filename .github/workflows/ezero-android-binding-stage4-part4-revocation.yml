name: E-ZERO Android Binding Stage 4 Part 4 — Revocation Runtime Gate
on:
  push:
    branches:
      - ezero-android-binding-stage4-part4-revocation-runtime-20261120
    paths:
      - "signaling/cloudflare/src/android_binding_durable_object_adapter_v1.mjs"
      - "signaling/cloudflare/src/android_binding_ledger_core_v1.cjs"
      - "signaling/cloudflare/android-binding-runtime-test/**"
      - ".github/workflows/ezero-android-binding-stage4-part4-revocation.yml"
  pull_request:
    branches:
      - ezero-android-binding-stage4-part3-retention-cleanup-20261120
    paths:
      - "signaling/cloudflare/src/android_binding_durable_object_adapter_v1.mjs"
      - "signaling/cloudflare/src/android_binding_ledger_core_v1.cjs"
      - "signaling/cloudflare/android-binding-runtime-test/**"
      - ".github/workflows/ezero-android-binding-stage4-part4-revocation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revocation-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: signaling/cloudflare/android-binding-runtime-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated runtime test dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run real workerd SQLite Durable Object tests
        run: npm run test:runtime
