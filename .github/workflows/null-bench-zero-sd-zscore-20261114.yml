name: Null Bench Zero-SD Z-score RED-GREEN QA
on:
  push:
    branches:
      - null-bench-zero-sd-zscore-qa-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-sd-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent changes outside Null Bench graph result and explanatory guide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=15
          git diff --name-only origin/main...HEAD >/tmp/ezero-zscore-changed.txt
          cat /tmp/ezero-zscore-changed.txt
          if grep -Ev '^(index\.html|null_bench_professional_guide\.html|tests/test_null_bench_zero_sd_zscore_20261114\.cjs|\.github/workflows/null-bench-zero-sd-zscore-20261114\.yml|\.github/workflows/null-bench-professional-guide-public-20261114\.yml)$' /tmp/ezero-zscore-changed.txt; then
            echo UNAUTHORIZED_CODE_CHANGE; exit 1
          fi
          git diff --unified=0 origin/main...HEAD -- index.html | grep -E '^[+][^+].*(workers.dev|websocket|RTCPeerConnection|\.onrender\.com|googletagmanager|gtag\(.config)' && { echo UNAUTHORIZED_RISKY_ADDITION; exit 1; } || true
      - name: Check zero-SD N/A and nonzero-SD behavior
        run: |
          node --check tests/test_null_bench_zero_sd_zscore_20261114.cjs
          node --test tests/test_null_bench_zero_sd_zscore_20261114.cjs
      - name: Preserve original statistical runner and public guide contracts
        run: |
          node tests/test_benchmark006c_runtime_v0_1.js
          node tests/test_benchmark006c_public_runner_v0_1.js
          node --test tests/test_null_bench_trilingual_guide_20261114.cjs
      - name: Report isolated testing only
        run: echo "NON_DEPLOYMENT_STAGING_QA_ONLY"
