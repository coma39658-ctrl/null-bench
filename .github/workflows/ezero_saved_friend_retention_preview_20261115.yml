name: E-ZERO Secure App Saved Friend Name Retention (Multi-Call)
on:
  push:
    branches: [ezero-noqr-friend-consent-status-fix-20261115]
  pull_request:
    branches: [main]
    paths:
      - 'noqr-preview-20261115/js/ezero_contact_first_call_dock_v0_1.js'
      - 'noqr-preview-20261115/js/ezero_trusted_stage_one_request_v0_1.js'
      - 'noqr-preview-20261115/js/ezero_trusted_friend_foreground_client_candidate_v0_1.js'
      - 'noqr-preview-20261115/js/ezero_trusted_friends_controls_candidate_v0_1.js'
      - 'tests/test_ezero_saved_friend_contact_retention_preview_20261115.mjs'
      - '.github/workflows/ezero_saved_friend_retention_preview_20261115.yml'
permissions:
  contents: read
jobs:
  repeat-call-retains-friend-names:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect existing public WebRTC engine and trust storage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=30
          git diff --name-only origin/main...HEAD | tee /tmp/ezero-retention-changes.txt
          if grep -Ev '^(noqr-preview-20261115/js/ezero_contact_first_call_dock_v0_1\.js|noqr-preview-20261115/js/ezero_trusted_stage_one_request_v0_1\.js|noqr-preview-20261115/js/ezero_trusted_friend_foreground_client_candidate_v0_1\.js|noqr-preview-20261115/js/ezero_trusted_friends_controls_candidate_v0_1\.js|tests/test_ezero_saved_friend_contact_retention_preview_20261115\.mjs|\.github/workflows/ezero_saved_friend_retention_preview_20261115\.yml)$' /tmp/ezero-retention-changes.txt; then
            echo 'OUT_OF_SCOPE_CHANGE'; exit 1
          fi
          node --check noqr-preview-20261115/js/ezero_contact_first_call_dock_v0_1.js
          node --check noqr-preview-20261115/js/ezero_trusted_stage_one_request_v0_1.js
          node --check noqr-preview-20261115/js/ezero_trusted_friend_foreground_client_candidate_v0_1.js
          node --check noqr-preview-20261115/js/ezero_trusted_friends_controls_candidate_v0_1.js
          node --check tests/test_ezero_saved_friend_contact_retention_preview_20261115.mjs
      - name: Install isolated browser QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0 ws@8.18.3
          npx playwright install --with-deps chromium
      - name: Serve current branch only on localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-contact-retention.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/noqr-preview-20261115/ezero_trusted_friends_staging_20261106.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-contact-retention.log; exit 1
      - name: First QR, saved contact, two repeated video calls, both phones names intact
        run: node tests/test_ezero_saved_friend_contact_retention_preview_20261115.mjs
      - name: Evidence remains lab-only
        run: echo 'ISOLATED_TWO_BROWSER_MOCKED_INBOX_NO_REAL_PHONE_OR_CLOUD_PROOF'
