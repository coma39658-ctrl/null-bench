name: E-ZERO Android Host — Staging Build

on:
  push:
    branches:
      - ezero-android-incoming-call-ringtone-staging-20261120
    paths:
      - "android/**"
      - ".github/workflows/ezero-android-host-build-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          cmdline-tools: 11076708
          accept-android-sdk-licenses: true
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK (compile artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: ezero-android-host-debug-staging
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
