name: E-ZERO Android Host — Staging Build

on:
  push:
    branches:
      - ezero-android-incoming-call-ringtone-staging-20261120
      - ezero-android-home-icon-staging-20261120
      - ezero-android-package-isolated-staging75-20261122
      - ezero-android-fcm-replay-guard-staging-20261125
    paths:
      - "android/**"
      - "signaling/cloudflare/src/call_wake_signing_v1.js"
      - "signaling/cloudflare/src/call_wake_signing_v1.test.mjs"
      - ".github/workflows/ezero-android-host-build-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EZERO_STAGING_KEYSTORE_BASE64: ${{ secrets.STAGING_KEYSTORE_BASE64 }}
      EZERO_STAGING_STORE_PASSWORD: ${{ secrets.STAGING_KEYSTORE_PASSWORD }}
      EZERO_STAGING_KEY_ALIAS: ${{ secrets.STAGING_KEY_ALIAS }}
      EZERO_STAGING_KEY_PASSWORD: ${{ secrets.STAGING_KEY_PASSWORD }}
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4
      - name: Restore Firebase configuration from Actions secret
        shell: bash
        env:
          STAGING_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.STAGING_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::error::Missing repository Actions secret: STAGING_GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi
          printf '%s' "$STAGING_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PYJSON'
          import json
          from pathlib import Path
          data = json.loads(Path("android/app/google-services.json").read_text())
          packages = {
              c["client_info"]["android_client_info"]["package_name"]
              for c in data.get("client", [])
          }
          if "com.ezero.connect.staging75" not in packages:
              raise SystemExit("Firebase staging75 package validation FAILED")
          print("Firebase staging75 package validation: PASS")
          PYJSON
          chmod 600 android/app/google-services.json
      - name: Set up Node.js 22 for push-signature contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Android-compatible server call-wake signing contract
        run: node --test signaling/cloudflare/src/call_wake_signing_v1.test.mjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate and provision stable staging signer
        shell: bash
        run: |
          set -euo pipefail
          for name in EZERO_STAGING_KEYSTORE_BASE64 EZERO_STAGING_STORE_PASSWORD EZERO_STAGING_KEY_ALIAS EZERO_STAGING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/ezero-staging-signing.jks"
          printf '%s' "$EZERO_STAGING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          EXPECTED_CERT_SHA256="485840df5305af07a78973fa6b573a440c6001f175e415b57724904f1d6c74f8"
          KEY_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$EZERO_STAGING_STORE_PASSWORD" -alias "$EZERO_STAGING_KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$KEY_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Staging keystore certificate fingerprint does not match the approved v2 certificate."
            exit 1
          fi
          echo "EZERO_STAGING_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Stable staging signer validated; expected certificate fingerprint matches."
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Compile APK with stable staging signature
        run: gradle -p android :app:assembleDebug
      - name: Verify APK signer and application ID
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          EXPECTED_CERT_SHA256="485840df5305af07a78973fa6b573a440c6001f175e415b57724904f1d6c74f8"
          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$APK_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::APK signer certificate fingerprint does not match the approved v2 staging certificate."
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.ezero.connect.staging75'"
          echo "APK signature, exact certificate fingerprint, and staging application ID verified."
      - name: Upload debug APK (compile artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: ezero-android-host-debug-staging
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
