name: E-ZERO Android Host — Staging Build

on:
  push:
    branches:
      - ezero-connect-android-push-wake-staging-20261125
    paths:
      - "android/**"
      - "signaling/ezero-connect-v1/**"
      - "js/ezero_connect_trusted_friend_call_controller_v1.mjs"
      - "tests/test_ezero_connect_rendezvous_v1.mjs"
      - ".github/workflows/ezero-android-host-build-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Node for signaling contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run trusted rendezvous offline-call queue tests
        run: |
          node --check signaling/ezero-connect-v1/rendezvous.mjs
          node --check js/ezero_connect_trusted_friend_call_controller_v1.mjs
          node --check js/ezero_connect_first_call_handoff_v1.mjs
          node tests/test_ezero_connect_rendezvous_v1.mjs
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK (compile artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: ezero-android-host-debug-staging
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
