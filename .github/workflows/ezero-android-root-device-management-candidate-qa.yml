name: E-ZERO Android Root Device Management Candidate QA

on:
  push:
    branches:
      - ezero-android-root-device-management-staging-20261125
    paths:
      - "signaling/cloudflare/src/android_enrollment_candidate_v1.js"
      - "signaling/cloudflare/wrangler.android-enrollment-candidate-v1.jsonc"
      - "signaling/cloudflare/wrangler.jsonc"
      - "tests/ezero_android_root_enrollment_contract_v1.test.mjs"
      - "tests/ezero_android_root_device_management_candidate_v1.test.mjs"
      - ".github/workflows/ezero-android-root-device-management-candidate-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify root enrollment contract
        run: node --test tests/ezero_android_root_enrollment_contract_v1.test.mjs
      - name: Verify root device management safeguards
        run: node --test tests/ezero_android_root_device_management_candidate_v1.test.mjs
      - name: Validate isolated Worker bundle without deploying
        working-directory: signaling/cloudflare
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.android-enrollment-candidate-v1.jsonc
      - name: Confirm active Worker remains isolated
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const a=fs.readFileSync('signaling/cloudflare/wrangler.jsonc','utf8'); const c=fs.readFileSync('signaling/cloudflare/wrangler.android-enrollment-candidate-v1.jsonc','utf8'); if(a.includes('android_enrollment_candidate_v1.js') || a.includes('AndroidEnrollmentRegistry')) throw new Error('candidate leaked into active Worker'); if(!c.includes('android_enrollment_candidate_v1.js')) throw new Error('candidate entrypoint missing'); console.log('ACTIVE_WORKER_ISOLATION_PASS')"
