name: E-ZERO Public Scale Readiness (Offline Architecture Gate)
on:
  push:
    branches:
      - ezero-public-scale-readiness-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-scale-readiness:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check protected WebRTC and signaling syntax
        run: |
          node --check signaling/cloudflare/src/worker.js
          node --check signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js
          node --check tests/test_ezero_public_scale_architecture_20261114.cjs
      - name: Verify isolated multi-user routing model (NOT live load)
        run: node --test tests/test_ezero_public_scale_architecture_20261114.cjs
      - name: Preserve existing media and browser integration contracts
        run: |
          node --test tests/test_ezero_qr_close_video_swap_static_20261113.cjs
          node --test tests/test_ezero_public_video_mode_preservation_20261106.cjs
          node --test tests/test_ezero_render_inbox_browser_integration_contract_20261111.cjs
      - name: Assert staging build keeps experimental inbox disabled
        run: |
          python3 scripts/build_ezero_secure_app_render_staging_20261107.py
          node -e 'const fs=require("fs");const x=fs.readFileSync("dist_ezero_secure_app_two_phone_staging/js/ezero_trusted_inbox_stage_config_20261106.js","utf8");if(!x.includes("enabled:false")||x.includes("enabled:true"))process.exit(1);'
