name: E-ZERO Render Trusted Inbox isolated safety gate
on:
  push:
    branches:
      - ezero-render-inbox-implementation-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate JavaScript syntax
        run: |
          node --check signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js
          node --check js/ezero_trusted_friend_foreground_client_candidate_v0_1.js
      - name: Isolated origin and security static gate
        run: node --test tests/test_ezero_render_inbox_static_gate_20261111.cjs
      - name: Exercise isolated Trusted Inbox runtime rejection and routing
        run: node --test tests/test_ezero_render_inbox_runtime_gate_20261111.cjs
      - name: Check browser and call-screen integration contracts
        run: node --test tests/test_ezero_render_inbox_browser_integration_contract_20261111.cjs
      - name: Compile dedicated Worker without deploying
        working-directory: signaling/cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.trusted-render-test-20261111.jsonc --dry-run --outdir /tmp/ezero-trusted-inbox-build
      - name: Exercise real local Worker HTTP upgrade boundary (no deployment)
        working-directory: signaling/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --config wrangler.trusted-render-test-20261111.jsonc --local --ip 127.0.0.1 --port 8788 > /tmp/ezero-inbox-local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8788/__readiness_missing >/dev/null 2>&1; then
              ready=1
              break
            fi
            if curl -sS --max-time 2 http://127.0.0.1:8788/__readiness_missing >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/ezero-inbox-local.log; exit 1; fi
          path="/v1/trusted/$(printf 'a%.0s' {1..64})"
          assert_status() {
            local expected="$1"
            shift
            local actual
            actual=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "$@")
            echo "expected=$expected actual=$actual"
            [ "$actual" = "$expected" ]
          }
          assert_status 404 "http://127.0.0.1:8788/invalid"
          assert_status 403 "http://127.0.0.1:8788$path"
          assert_status 426 -H 'Origin: https://ezero-secure-app-two-phone-test-20261107.onrender.com' "http://127.0.0.1:8788$path"
          assert_status 404 -H 'Origin: https://ezero-secure-app-two-phone-test-20261107.onrender.com' "http://127.0.0.1:8788$path?unexpected=1"
      - name: Build current Render preview without enabling unverified inbox
        run: python3 scripts/build_ezero_secure_app_render_staging_20261107.py
      - name: Assert live-preview build remains fail closed
        run: |
          grep -F 'enabled:false' dist_ezero_secure_app_two_phone_staging/js/ezero_trusted_inbox_stage_config_20261106.js
          ! grep -F 'ezero-trusted-inbox-render-test' dist_ezero_secure_app_two_phone_staging/js/ezero_trusted_inbox_stage_config_20261106.js
