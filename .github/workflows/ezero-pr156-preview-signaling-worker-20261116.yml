name: E-ZERO PR156 preview signaling worker
on:
  push:
    branches: [ezero-pr156-render-preview-20261116]
    paths:
      - 'signaling/cloudflare/src/worker.js'
      - 'tests/test_ezero_pr156_preview_worker_smoke_20261118.mjs'
      - 'signaling/cloudflare/wrangler.pr156-preview-v2-20261116.jsonc'
      - '.github/workflows/ezero-pr156-preview-signaling-worker-20261116.yml'
permissions:
  contents: read
jobs:
  deploy-isolated-preview-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare credentials exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Verify exact isolated origin and worker name
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const c=JSON.parse(require('node:fs').readFileSync('signaling/cloudflare/wrangler.pr156-preview-v2-20261116.jsonc','utf8'));
          assert.equal(c.name,'ezero-browser-signaling-pr156-preview-v2');
          assert.equal(c.vars.PUBLIC_ORIGIN,'https://ezero-save-friend-pr156-preview-v2.onrender.com');
          assert.equal(c.workers_dev,true);
          assert.equal(c.durable_objects.bindings[0].class_name,'SignalRoom');
          console.log('PR156_PREVIEW_SIGNALING_ISOLATION: PASS');
          NODE
          node --input-type=module --check < signaling/cloudflare/src/worker.js
      - name: Ensure isolated Worker resource exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/workers/ezero-browser-signaling-pr156-preview-v2"
          CODE="$(curl --silent --show-error -o /tmp/worker-resource.json -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$API")"
          if [ "$CODE" = "200" ]; then
            echo "PR156 preview Worker resource already exists."
          elif [ "$CODE" = "404" ]; then
            curl --fail --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/workers" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data '{"name":"ezero-browser-signaling-pr156-preview-v2"}' > /tmp/worker-create.json
            node -e "const r=require('/tmp/worker-create.json'); if(!r.success) { console.error(JSON.stringify(r.errors)); process.exit(1) }"
            echo "PR156 preview Worker resource created."
          else
            cat /tmp/worker-resource.json
            echo "::error::Unexpected Cloudflare Worker lookup HTTP $CODE"
            exit 1
          fi
      - name: Deploy only the PR156 preview signaling Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: signaling/cloudflare
          command: deploy --config wrangler.pr156-preview-v2-20261116.jsonc
      - name: Verify deployed Worker health using the account's actual workers.dev subdomain
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
            -o /tmp/workers-subdomain.json
          SUBDOMAIN="$(node -e "const r=require('/tmp/workers-subdomain.json'); if(!r.success || !r.result?.subdomain) process.exit(2); process.stdout.write(r.result.subdomain)")"
          BASE="https://ezero-browser-signaling-pr156-preview-v2.$SUBDOMAIN.workers.dev"
          echo "Checking isolated Worker health at $BASE/v1/health"
          for attempt in $(seq 1 10); do
            CODE="$(curl --silent --show-error -o /tmp/worker-health.json -w '%{http_code}' "$BASE/v1/health" || true)"
            if [ "$CODE" = "200" ] && grep -Fq '"purpose":"signaling-only"' /tmp/worker-health.json; then
              cat /tmp/worker-health.json
              echo "PR156_PREVIEW_WORKER_HEALTH: PASS"
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $CODE"
            cat /tmp/worker-health.json || true
            sleep 3
          done
          echo "::error::Isolated Worker health did not return the expected signaling-only response"
          exit 1
      - name: Live two-peer signaling smoke test
        env:
          EZERO_WS_MODULE: /tmp/ezero-pr156-smoke/node_modules/ws
        run: |
          set -euo pipefail
          npm install --prefix /tmp/ezero-pr156-smoke --no-save --no-package-lock ws@8
          node tests/test_ezero_pr156_preview_worker_smoke_20261118.mjs
