name: E-ZERO isolated trusted inbox staging deploy
on:
  push:
    branches: [ezero-secure-simple-home-ui-stage-20261113]
    paths:
      - 'signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js'
      - 'signaling/cloudflare/wrangler.trusted-render-test-20261111.jsonc'
      - '.github/workflows/ezero-simple-home-inbox-worker-stage-20261113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare credentials exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID; configure repository Actions secrets."
            exit 1
          fi
      - name: Verify signed browser/Worker contract before deployment
        run: node tests/ezero_trusted_inbox_staging_origin_contract_20261113.cjs
      - name: Deploy staging-only inbox Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: signaling/cloudflare
          command: deploy --config wrangler.trusted-render-test-20261111.jsonc
      - name: Verify deployed Worker health and strict WebSocket gates
        run: |
          set -euo pipefail
          BASE="https://ezero-trusted-inbox-simple-home-stage.coma39658.workers.dev"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/health" | grep -F '"purpose":"trusted-inbox-staging"'
          FP=$(printf 'a%.0s' {1..64})
          CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" "$BASE/v1/trusted/$FP")
          test "$CODE" = "403"
          CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" -H "Origin: https://ezero-secure-simple-home-two-phone.onrender.com" "$BASE/v1/trusted/$FP")
          test "$CODE" = "426"
          curl --fail --silent --show-error -D /tmp/ezero-health-headers -o /tmp/ezero-health-body \
            -H "Origin: https://ezero-secure-simple-home-two-phone.onrender.com" "$BASE/health"
          grep -iFx "access-control-allow-origin: https://ezero-secure-simple-home-two-phone.onrender.com" /tmp/ezero-health-headers
          grep -F '"status":"ok"' /tmp/ezero-health-body
