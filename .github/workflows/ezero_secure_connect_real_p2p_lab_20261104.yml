name: E-ZERO Secure Connect Signed QR and Real P2P Call Lab QA
on:
  push:
    branches: [ezero-secure-connect-three-language-p2p-20261104]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  signed-identity-and-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate no upload, no recording, signed QR, multilingual UI
        run: |
          set -euo pipefail
          node --check js/vendor/ezero-qrcode-generator-mit.js
          node --check js/ezero_secure_connect_live_p2p_v0_1.js
          node --check js/ezero_secure_connect_preview_i18n_v0_1.js
          node --check tests/test_ezero_secure_connect_live_p2p_browser_v0_1.mjs
          node tests/test_ezero_secure_connect_live_p2p_contract_v0_1.js
          node tests/test_ezero_secure_connect_hub_contract_v0_1.js
  two-mobile-chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Chromium lab dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Test two real browser endpoints (audio, video, E2EE datachannel, fingerprint)
        run: |
          set -euo pipefail
          python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-secure-connect-p2p-qa.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8769/ezero_secure_connect_live_p2p_v0_1.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/test_ezero_secure_connect_live_p2p_browser_v0_1.mjs
          node tests/test_ezero_secure_connect_browser_v0_1.mjs
