name: E-ZERO Connect Signaling Worker — Manual Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ezero-connect-signaling-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy isolated E-ZERO signaling Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact green E-ZERO source
        uses: actions/checkout@v4
        with:
          ref: 955fae745c15830231719caa48c1262a438eae11
          path: ezero-source

      - name: Require staging-only Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy isolated E-ZERO signaling Worker and Durable Object migration
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ezero-source/signaling/ezero-connect-v1
          command: deploy --config wrangler.jsonc

      - name: Record staging target
        run: |
          echo "Source commit: 955fae745c15830231719caa48c1262a438eae11"
          echo "Worker name: ezero-connect-signal-staging-20261120"
          echo "Allowed browser origin: https://ezero-connect-live-clean-staging-20261121.onrender.com"
          echo "Use the exact workers.dev hostname printed by Wrangler above; do not infer or substitute a hostname."
