name: E-ZERO Android Binding Ledger — Isolated Core Gate
on:
  push:
    branches:
      - ezero-android-binding-ledger-stage3-20261120
    paths:
      - "signaling/cloudflare/src/android_binding_ledger_core_v1.cjs"
      - "tests/test_ezero_android_binding_ledger_core_v1.cjs"
      - ".github/workflows/ezero-android-binding-ledger-stage3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-ledger-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test atomic nonce consumption, expiry, scope, and revocation
        run: node --test tests/test_ezero_android_binding_ledger_core_v1.cjs
