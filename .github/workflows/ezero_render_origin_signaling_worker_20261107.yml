name: E-ZERO Isolated Render-Origin Signaling Worker Staging
on:
  push:
    branches: [ezero-profile-first-saved-friends-20261106]
    paths:
      - 'signaling/cloudflare/wrangler.render-two-phone-test-20261107.jsonc'
      - '.github/workflows/ezero_render_origin_signaling_worker_20261107.yml'
permissions:
  contents: read
concurrency:
  group: ezero-isolated-render-origin-signaling-20261107
  cancel-in-progress: false
jobs:
  deploy-isolated-render-origin-worker:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ezero-profile-first-saved-friends-20261106' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated worker name and single Render origin
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "DEPLOY_BLOCKED: GitHub Cloudflare deployment secrets are unavailable"
            exit 1
          fi
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const p='signaling/cloudflare/wrangler.render-two-phone-test-20261107.jsonc';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          assert.equal(x.name,'ezero-browser-signaling-render-test');
          assert.equal(x.vars.PUBLIC_ORIGIN,
            'https://ezero-secure-app-two-phone-test-20261107.onrender.com');
          assert.equal(x.durable_objects.bindings[0].class_name,'SignalRoom');
          assert.notEqual(x.name,'ezero-browser-signaling-pilot');
          assert.equal(x.workers_dev,true);
          console.log('ISOLATED_RENDER_WORKER_CONFIG: PASS');
          NODE
      - name: Deploy NEW Render-origin Worker (never overwrite pilot or trusted inbox)
        shell: bash
        working-directory: signaling/cloudflare
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.render-two-phone-test-20261107.jsonc
      - name: Verify new isolated health endpoint (no media, no room tokens)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 15 \
            'https://ezero-browser-signaling-render-test.coma39658.workers.dev/v1/health' \
            | grep -Fq '"purpose":"signaling-only"'
          echo 'RENDER_ORIGIN_SIGNALING_WORKER_HEALTH: PASS'
