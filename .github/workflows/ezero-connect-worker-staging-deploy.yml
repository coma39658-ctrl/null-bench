name: E-ZERO Connect isolated signaling Worker deploy

on:
  push:
    branches:
      - ezero-connect-qr-renderer-20261120
    paths:
      - 'signaling/ezero-connect-v1/**'
      - '.github/workflows/ezero-connect-worker-staging-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: "Deploy only the isolated E-ZERO Connect staging Worker (never production)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-staging-worker:
    if: github.ref == 'refs/heads/ezero-connect-qr-renderer-20261120' && (github.event_name == 'push' || inputs.confirm_staging_deploy == true)
    runs-on: ubuntu-22.04
    steps:
      - name: Verify Cloudflare credentials are configured without displaying them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Wrangler
        run: npm install --no-save --no-audit --no-fund --ignore-scripts wrangler@4.165.0
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/ezero-connect-worker-staging --config signaling/ezero-connect-v1/wrangler.jsonc
      - name: Deploy isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config signaling/ezero-connect-v1/wrangler.jsonc
