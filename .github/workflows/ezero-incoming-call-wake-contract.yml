name: E-ZERO Incoming Call Wake Interoperability Contract
on:
  push:
    branches:
      - ezero-incoming-call-wake-contract-stage5-20261120
      - ezero-incoming-call-wake-key-pin-config-stage6-20261120
    paths:
      - "android/app/build.gradle.kts"
      - "android/app/src/main/java/com/ezero/connect/IncomingCallWakeSignatureVerifier.kt"
      - "android/app/src/test/**"
      - "android/call-wake-contract/**"
      - ".github/workflows/ezero-incoming-call-wake-contract.yml"
  pull_request:
    branches:
      - ezero-incoming-call-wake-contract-stage5-20261120
    paths:
      - "android/app/build.gradle.kts"
      - "android/app/src/main/java/com/ezero/connect/IncomingCallWakeSignatureVerifier.kt"
      - "android/app/src/test/**"
      - "android/call-wake-contract/**"
      - ".github/workflows/ezero-incoming-call-wake-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sender-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify server-side signer contract
        run: node --test android/call-wake-contract/test/call_wake_signer_v1.test.cjs
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify Android canonical-byte and key-pin configuration tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon
