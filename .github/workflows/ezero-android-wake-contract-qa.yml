name: E-ZERO Android Wake Contract QA

on:
  push:
    branches:
      - ezero-android-wake-contract-qa-20261124
    paths:
      - "tests/ezero_android_wake_sender_contract_v1.test.mjs"
      - ".github/workflows/ezero-android-wake-contract-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated wake contract tests
        run: node --test tests/ezero_android_wake_sender_contract_v1.test.mjs
