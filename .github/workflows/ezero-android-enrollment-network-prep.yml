name: E-ZERO Android Enrollment Network Prep — Staging Build

on:
  push:
    branches:
      - ezero-android-enrollment-network-prep-20261124
    paths:
      - "android/**"
      - ".github/workflows/ezero-android-enrollment-network-prep.yml"

permissions:
  contents: read

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Compile debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK (compile artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: ezero-android-enrollment-network-prep
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
