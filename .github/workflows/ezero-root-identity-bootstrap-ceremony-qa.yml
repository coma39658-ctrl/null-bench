name: E-ZERO Root Identity Bootstrap Ceremony QA

on:
  push:
    branches:
      - ezero-root-bootstrap-ceremony-contract-20261125
    paths:
      - android/ROOT_IDENTITY_BOOTSTRAP_CEREMONY_V1.md
      - tests/ezero_root_identity_bootstrap_ceremony_v1.test.mjs
      - .github/workflows/ezero-root-identity-bootstrap-ceremony-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify root bootstrap ceremony safeguards
        run: node --test tests/ezero_root_identity_bootstrap_ceremony_v1.test.mjs
