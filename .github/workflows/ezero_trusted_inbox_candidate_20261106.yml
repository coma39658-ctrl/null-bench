name: E-ZERO Trusted Friends Inbox Prototype Security Tests
on:
  push:
    branches:
      - ezero-trusted-friend-inbox-lab-20261106
  pull_request:
    branches: [main]
    paths:
      - 'signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js'
      - 'tests/test_ezero_trusted_inbox_candidate_20261106.cjs'
      - 'js/ezero_trusted_friend_foreground_client_candidate_v0_1.js'
      - 'tests/test_ezero_trusted_friend_foreground_client_20261106.cjs'
      - '.github/workflows/ezero_trusted_inbox_candidate_20261106.yml'
permissions:
  contents: read
jobs:
  verify-trusted-inbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed inbox and trust/revoke integration tests
        run: |
          set -euo pipefail
          node --check signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js
          node --check tests/test_ezero_trusted_inbox_candidate_20261106.cjs
          node tests/test_ezero_trusted_inbox_candidate_20261106.cjs
          node --check js/ezero_trusted_friend_foreground_client_candidate_v0_1.js
          node --check tests/test_ezero_trusted_friend_foreground_client_20261106.cjs
          node tests/test_ezero_trusted_friend_foreground_client_20261106.cjs
      - name: Keep successful QR production separate
        run: |
          set -euo pipefail
          ! grep -Fq 'trusted_inbox_candidate_v0_1.js' ezero_secure_connect_one_request_lab_20261106.html
          ! grep -Fq 'TrustedInbox' signaling/cloudflare/wrangler.jsonc
          ! grep -Fq 'TrustedInbox' signaling/cloudflare/src/worker.js
          grep -Fq 'ezero_secure_connect_auto_signaling_pilot_v0_1.js' ezero_secure_connect_one_request_lab_20261106.html
