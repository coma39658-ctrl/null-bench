name: E-ZERO QR Clock-Skew Isolated Worker Staging

on:
  push:
    branches:
      - ezero-connect-qr-clock-skew-repair-staging-20261125
    paths:
      - 'signaling/ezero-connect-v1/**'
      - 'signaling/ezero-connect-qr-clock-skew-staging/wrangler.jsonc'
      - '.github/workflows/ezero-qr-clock-skew-isolated-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: ezero-qr-clock-skew-isolated-worker-staging
  cancel-in-progress: false

jobs:
  deploy-isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund --ignore-scripts wrangler@4.165.0
      - name: Require Cloudflare staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated QR repair Worker and fresh Durable Object namespaces
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config signaling/ezero-connect-qr-clock-skew-staging/wrangler.jsonc
