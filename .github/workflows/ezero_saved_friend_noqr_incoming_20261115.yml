name: E-ZERO Secure App Saved Friend No-QR Incoming Lab QA
on:
  push:
    branches:
      - ezero-saved-friend-noqr-incoming-qa-20261115
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-qr-foreground-delivery:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - name: Checkout staged source, without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce test-only safety boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=15
          git diff --name-only origin/main...HEAD | tee /tmp/ezero-saved-friend-changes.txt
          if grep -Ev '^(js/ezero_trusted_stage_one_request_v0_1\.js|js/ezero_trusted_friends_controls_candidate_v0_1\.js|js/ezero_trusted_stage_signaling_v0_1\.js|tests/test_ezero_saved_friend_noqr_incoming_20261115\.mjs|tests/test_ezero_saved_friend_noqr_audio_20261115\.mjs|\.github/workflows/ezero_saved_friend_noqr_incoming_20261115\.yml)$' /tmp/ezero-saved-friend-changes.txt; then
            echo 'UNEXPECTED_PRODUCTION_FILE_CHANGE'
            exit 1
          fi
          node --check js/ezero_trusted_stage_one_request_v0_1.js
          node --check js/ezero_trusted_friends_controls_candidate_v0_1.js
          node --check js/ezero_trusted_stage_signaling_v0_1.js
          node --check tests/test_ezero_saved_friend_noqr_incoming_20261115.mjs
          node --check tests/test_ezero_saved_friend_noqr_audio_20261115.mjs
      - name: Install isolated browser QA dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0 ws@8.18.3
          npx playwright install --with-deps chromium
      - name: Serve candidate only on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-saved-friend-noqr-lab.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ezero_trusted_friends_staging_20261106.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-saved-friend-noqr-lab.log
          exit 1
      - name: Prove saved friend receives a foreground incoming call without QR relaying
        run: node tests/test_ezero_saved_friend_noqr_incoming_20261115.mjs
      - name: Prove AUDIO no-QR contact calling with live mic tracks and zero camera tracks
        run: node tests/test_ezero_saved_friend_noqr_audio_20261115.mjs
      - name: Report lab-only evidence
        run: echo 'ISOLATED_CHROMIUM_SIMULATED_TRUSTED_INBOX_NO_DEPLOYMENT_NO_PHYSICAL_PHONE_PROOF'
