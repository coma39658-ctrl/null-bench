name: E-ZERO Trusted Inbox isolated staging deploy (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY-EZERO-TRUSTED-INBOX-TEST to authorize the isolated test Worker'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ezero-trusted-inbox-isolated-manual-deploy
  cancel-in-progress: false
jobs:
  staging-only:
    if: ${{ github.repository == 'coma39658-ctrl/null-bench' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-EZERO-TRUSTED-INBOX-TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: ezero-trusted-inbox-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout fixed reviewed staging candidate
        uses: actions/checkout@v4
        with:
          ref: dca016430238651f7e3432a5d1ebe2f79475fd7f
          persist-credentials: false
      - name: Confirm exact reviewed candidate commit is checked out
        shell: bash
        run: |
          set -euo pipefail
          expected='dca016430238651f7e3432a5d1ebe2f79475fd7f'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || { echo 'Candidate SHA mismatch; deployment blocked'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging target and secret availability
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare token not configured'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account ID not configured'; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('signaling/cloudflare/wrangler.trusted-render-test-20261111.jsonc','utf8'));
          if(c.name!=='ezero-trusted-inbox-render-test'||c.main!=='src/trusted_inbox_candidate_v0_1.js'||c.workers_dev!==true||c.vars?.PUBLIC_ORIGIN!=='https://ezero-secure-app-two-phone-test-20261107.onrender.com')throw Error('Isolated target mismatch');
          NODE
      - name: Verify isolated security and runtime tests
        run: |
          node --test tests/test_ezero_render_inbox_static_gate_20261111.cjs
          node --test tests/test_ezero_render_inbox_runtime_gate_20261111.cjs
          node --test tests/test_ezero_render_inbox_browser_integration_contract_20261111.cjs
      - name: Compile isolated Worker before any remote deployment
        working-directory: signaling/cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.trusted-render-test-20261111.jsonc --dry-run --outdir /tmp/ezero-trusted-inbox-staging-compile
      - name: Verify generated Worker bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/ezero-trusted-inbox-staging-compile
          find /tmp/ezero-trusted-inbox-staging-compile -type f -name '*.js' -print -quit | grep -q .
      - name: Deploy only the dedicated staging Worker
        working-directory: signaling/cloudflare
        run: npx --yes wrangler@4 deploy --config wrangler.trusted-render-test-20261111.jsonc
