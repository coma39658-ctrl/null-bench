name: Null Bench Professional Guide Public Release Gate
on:
  push:
    branches:
      - null-bench-public-professional-guide-20261114
  pull_request:
    paths:
      - 'README.md'
      - 'docs/null-bench-quickstart-ur-en-ar.md'
      - 'index.html'
      - 'null_bench_professional_guide.html'
      - 'tests/test_null_bench_professional_guide_20261114.cjs'
      - 'tests/test_null_bench_professional_guide_browser_20261114.mjs'
      - '.github/workflows/null-bench-professional-guide-public-20261114.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  professional-guide-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Checkout with no write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: No old code removals, no AI/OBD/Secure App/Analytics/Worker changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=15
          git diff --name-only origin/main...HEAD > /tmp/null-guide-changed.txt
          cat /tmp/null-guide-changed.txt
          if grep -Ev '^(README\.md|docs/null-bench-quickstart-ur-en-ar\.md|index\.html|null_bench_professional_guide\.html|tests/test_null_bench_professional_guide_20261114\.cjs|tests/test_null_bench_professional_guide_browser_20261114\.mjs|tests/test_null_bench_zero_sd_zscore_20261114\.cjs|\.github/workflows/null-bench-zero-sd-zscore-20261114\.yml|tests/test_null_bench_distinct_edges_20261114\.cjs|\.github/workflows/null-bench-distinct-edges-20261114\.yml|\.github/workflows/null-bench-professional-guide-public-20261114\.yml)$' /tmp/null-guide-changed.txt; then
            echo 'UNEXPECTED_RUNTIME_OR_PRIVACY_FILE_CHANGE'
            exit 1
          fi
          # Preserve the additions-only rule for ordinary guide PRs.
          # Exception: precisely the three reviewed zero-SD z-score corrections,
          # including unchanged public GA4 event wiring when SD > 0.
          if git diff --unified=0 origin/main...HEAD -- index.html | grep -Eq '^-[^-]' ; then
            removed="$(git diff --unified=0 origin/main...HEAD -- index.html | grep -E '^-[^-]')"
            added="$(git diff --unified=0 origin/main...HEAD -- index.html | grep -E '^\+[^+]')"
            expected_removed="$(printf '%s\n' '-   :0;' '-  z.toFixed(2);' '-   z_score:Number(z.toFixed(4)),')"
            expected_added="$(printf '%s\n' '+   :null;' '+  z===null?"N/A":z.toFixed(2);' '+   ...(z===null?{}:{z_score:Number(z.toFixed(4))}),')"
            expected_edge_removed="$(printf '%s\n' '-  nodeCount+" / "+edges.length;' '-   edge_count:edges.length,')"
            expected_edge_added="$(printf '%s\n' '+ const edgeCount=edgesFromAdjacency(baseAdj).length;' '+  nodeCount+" / "+edgeCount;' '+   edge_count:edgeCount,')"
            if [[ "$removed" == "$expected_removed" && "$added" == "$expected_added" ]]; then
              echo 'EXACT_THREE_LINE_ZERO_SD_EXCEPTION: PASS'
            elif [[ "$removed" == "$expected_edge_removed" && "$added" == "$expected_edge_added" ]]; then
              echo 'EXACT_DISTINCT_UNDIRECTED_EDGES_EXCEPTION: PASS'
            else
              echo 'UNREVIEWED_INDEX_REMOVAL_OR_ADDITION_REJECTED'
              exit 1
            fi
          else
            echo 'ADDITIONS_ONLY_INDEX_AND_GUIDE_BOUNDARY: PASS'
          fi
      - name: Check professional guide source, actual controls and privacy constraints
        run: |
          node --check tests/test_null_bench_professional_guide_20261114.cjs
          node --test tests/test_null_bench_professional_guide_20261114.cjs
          node --test tests/test_null_bench_trilingual_guide_20261114.cjs
      - name: Preserve original research benchmark algorithms
        run: |
          node tests/test_benchmark006c_runtime_v0_1.js
          node tests/test_benchmark006c_public_runner_v0_1.js
      - name: Install local Chromium for responsive QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify 360/800/1280 mobile and desktop, guide links and existing graph test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/ezero-professional-guide.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/index.html >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8767/null_bench_professional_guide.html >/dev/null
          node tests/test_null_bench_professional_guide_browser_20261114.mjs
      - name: Scope declaration
        run: |
          echo 'STAGING_TEST_ONLY; no deployment or release from workflow.'
          echo 'Live GitHub Pages release requires reviewed main merge, pages build, and external smoke.'
