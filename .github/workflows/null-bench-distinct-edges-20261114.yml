name: Null Bench Distinct Edges RED-GREEN QA
on:
  push:
    branches:
      - null-bench-distinct-edges-release-20261114
  pull_request:
    paths:
      - 'index.html'
      - 'null_bench_professional_guide.html'
      - 'tests/test_null_bench_distinct_edges_20261114.cjs'
      - '.github/workflows/null-bench-distinct-edges-20261114.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  distinct-undirected-edges:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Read-only isolated branch checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 30
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restrict scope to existing graph display and factual guide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=15
          git diff --name-only origin/main...HEAD >/tmp/ezero-distinct-files.txt
          cat /tmp/ezero-distinct-files.txt
          if grep -Ev '^(index\.html|null_bench_professional_guide\.html|tests/test_null_bench_distinct_edges_20261114\.cjs|tests/test_null_bench_zero_sd_zscore_20261114\.cjs|\.github/workflows/null-bench-distinct-edges-20261114\.yml|tests/test_null_bench_degenerate_verdict_20261114\.cjs|tests/test_null_bench_degenerate_verdict_browser_20261114\.mjs|tests/verify_null_bench_sd0_verdict_diff_20261114\.py|\.github/workflows/null-bench-degenerate-verdict-20261114\.yml|\.github/workflows/null-bench-professional-guide-public-20261114\.yml)$' /tmp/ezero-distinct-files.txt; then
            echo UNAUTHORIZED_FILE_CHANGE; exit 1
          fi
          if git diff --unified=0 origin/main...HEAD -- index.html | grep -E '^[+][^+].*(workers.dev|websocket|RTCPeerConnection|\.onrender\.com|googletagmanager|gtag\(.config)' ; then
            # Permit only the byte-exact reviewed E-ZERO Studio return link.
            if ! python3 tests/verify_null_bench_sd0_verdict_diff_20261114.py | grep -qx 'EXACT_EZERO_BACK_NAV_ONLY_INDEX_CHANGE: PASS'; then
              echo UNAUTHORIZED_NETWORK_OR_TRACKING_CHANGE; exit 1
            fi
          fi
      - name: Retain exact reviewed SD-zero verdict source boundary
        run: python3 tests/verify_null_bench_sd0_verdict_diff_20261114.py
      - name: Test graph display and metadata with duplicate/reversed/self-loop edges
        run: |
          node --check tests/test_null_bench_distinct_edges_20261114.cjs
          node --test tests/test_null_bench_distinct_edges_20261114.cjs
      - name: Preserve original benchmark runner and guide source contracts
        run: |
          node --test tests/test_null_bench_zero_sd_zscore_20261114.cjs
          node tests/test_benchmark006c_runtime_v0_1.js
          node tests/test_benchmark006c_public_runner_v0_1.js
          node --test tests/test_null_bench_trilingual_guide_20261114.cjs
      - name: Declare staging-only release boundary
        run: echo 'NON_DEPLOYMENT_QA_NO_MAIN_CHANGE'
