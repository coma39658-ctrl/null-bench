name: E-ZERO Global Contract Model
on:
  push:
    branches:
      - ezero-connect-global-rebuild-realtimekit-staging-20261125
  pull_request:
    branches:
      - ezero-connect-global-rebuild-realtimekit-staging-20261125
permissions:
  contents: read
jobs:
  contract-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ezero_connect_contract_model.test.mjs tests/ezero_connect_pending_call_model.test.mjs tests/ezero_android_enrollment_model.test.mjs signaling/ezero-connect-v1/android-enrollment-crypto-v1.test.mjs
