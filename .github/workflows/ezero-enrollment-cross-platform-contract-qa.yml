name: E-ZERO Enrollment Cross-Platform Contract QA

on:
  push:
    branches:
      - ezero-android-keystore-enrollment-client-staging-20261125
    paths:
      - "js/ezero_connect_identity_v1.js"
      - "tests/ezero_root_approval_browser_signer_v1.test.mjs"
      - "android/app/src/main/java/com/ezero/connect/AndroidEnrollmentKeyStore.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidEnrollmentProtocolV1.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidSignatureEncoding.kt"
      - "android/app/src/test/java/com/ezero/connect/AndroidEnrollmentProtocolV1Test.kt"
      - "tests/ezero_android_keystore_enrollment_client_v1.test.mjs"
      - ".github/workflows/ezero-enrollment-cross-platform-contract-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify browser root signer contract
        run: node --test tests/ezero_root_approval_browser_signer_v1.test.mjs
      - name: Verify Android enrollment source safeguards
        run: node --test tests/ezero_android_keystore_enrollment_client_v1.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Assemble isolated Android staging debug APK
        run: gradle -p android :app:assembleDebug
