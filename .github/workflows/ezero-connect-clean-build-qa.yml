  pull_request:
    paths:
      - 'ezero-connect.html'
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'js/ezero_connect_saved_friends_ui_v1.js'
      - 'js/ezero_connect_local_profile_v1.js'
      - 'js/ezero_connect_pairing_ui_v1.js'
      - 'js/ezero_connect_identity_v1.js'
      - 'js/ezero_connect_invite_v1.js'
      - 'js/ezero_connect_trust_v1.js'
      - 'js/ezero_connect_trusted_reconnect_v1.mjs'
      - 'js/ezero_connect_rendezvous_client_v1.mjs'
      - 'tests/test_ezero_connect_trusted_reconnect_v1.mjs'
      - 'tests/test_ezero_connect_rendezvous_v1.mjs'
      - 'scripts/ezero_connect_qr_entry_v1.js'
      - 'scripts/build_ezero_connect_qr_clock_skew_staging.sh'
      - 'package.json'
      - 'tests/test_ezero_connect_qr_runtime_v1.mjs'
      - 'tests/test_ezero_connect_qr_baseline_matrix_v1.mjs'
      - 'tests/test_ezero_connect_trust_v1.mjs'
      - 'tests/test_ezero_connect_signaling_v1.mjs'
      - 'tests/test_ezero_connect_signaling_local_v1.mjs'
      - 'js/ezero_connect_config_v1.js'
      - 'js/ezero_connect_signaling_client_v1.js'
      - 'js/ezero_connect_e2e_crypto_v1.mjs'
      - 'tests/test_ezero_connect_e2e_crypto_v1.mjs'
      - 'js/ezero_connect_e2e_datachannel_v1.mjs'
      - 'tests/test_ezero_connect_e2e_datachannel_v1.mjs'
      - 'js/ezero_connect_messaging_v1.mjs'
      - 'tests/test_ezero_connect_messaging_v1.mjs'
      - 'js/ezero_connect_webrtc_messaging_transport_v1.mjs'
      - 'js/ezero_connect_webrtc_media_call_v1.mjs'
      - 'js/ezero_connect_trusted_friend_call_controller_v1.mjs'
      - 'tests/test_ezero_connect_trusted_friend_call_controller_v1.mjs'
      - 'tests/test_ezero_connect_webrtc_media_call_v1.mjs'
      - 'tests/test_ezero_connect_webrtc_messaging_transport_v1.mjs'
      - 'js/ezero_connect_chat_ui_v1.mjs'
      - 'tests/test_ezero_connect_chat_ui_contract_v1.mjs'
      - 'js/ezero_connect_trusted_friend_session_v1.mjs'
      - 'js/ezero_connect_chat_ui_v1.mjs'
      - 'tests/test_ezero_connect_chat_ui_contract_v1.mjs'
      - 'tests/test_ezero_connect_trusted_friend_session_v1.mjs'
      - 'tests/test_ezero_connect_webrtc_messaging_transport_v1.mjs'
      - 'signaling/ezero-connect-v1/**'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - 'tests/test_ezero_connect_saved_friends_ui_v1.mjs'
      - 'tests/test_ezero_connect_local_profile_v1.mjs'
      - 'tests/test_ezero_connect_pairing_ui_v1.mjs'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'
  push:
    branches:
      - ezero-connect-clean-build-20261120
      - ezero-connect-qr-renderer-20261120
      - ezero-connect-client-20261120
      - ezero-connect-pr154-friend-retention-clean-20261121
      - ezero-connect-scalable-friends-profile-staging-20261121
    paths:
      - 'ezero-connect.html'
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'js/ezero_connect_identity_v1.js'
      - 'js/ezero_connect_invite_v1.js'
      - 'js/ezero_connect_trust_v1.js'
      - 'scripts/ezero_connect_qr_entry_v1.js'
      - 'package.json'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - 'tests/test_ezero_connect_trust_v1.mjs'
      - 'tests/test_ezero_connect_qr_runtime_v1.mjs'
      - 'tests/test_ezero_connect_qr_baseline_matrix_v1.mjs'
      - 'tests/test_ezero_connect_signaling_v1.mjs'
      - 'tests/test_ezero_connect_signaling_local_v1.mjs'
      - 'js/ezero_connect_config_v1.js'
      - 'js/ezero_connect_signaling_client_v1.js'
      - 'js/ezero_connect_e2e_crypto_v1.mjs'
      - 'tests/test_ezero_connect_e2e_crypto_v1.mjs'
      - 'js/ezero_connect_e2e_datachannel_v1.mjs'
      - 'js/ezero_connect_webrtc_messaging_transport_v1.mjs'
      - 'tests/test_ezero_connect_webrtc_messaging_transport_v1.mjs'
      - 'tests/test_ezero_connect_e2e_datachannel_v1.mjs'
      - 'signaling/ezero-connect-v1/**'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'

permissions:
  contents: read

jobs:
  frozen-two-phone-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the frozen legacy call-engine sources are untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ezero-connect-clean-build-20261120 --depth=50
          git diff --name-only origin/ezero-connect-clean-build-20261120...HEAD > /tmp/ezero-qr-changes.txt
          if grep -E '^js/(ezero_saved_friend_stage_engine_v0_1|ezero_trusted_stage_one_request_v0_1|ezero_contact_first_call_dock_v0_1)\.js$' /tmp/ezero-qr-changes.txt; then
            echo 'FROZEN_CALL_ENGINE_SOURCE_CHANGE_DETECTED'
            exit 1
          fi
          echo 'FROZEN_CALL_ENGINE_UNMODIFIED; THIS IS NOT PROOF OF NEW_CALL_FUNCTIONALITY'
  clean-mobile-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check js/ezero_connect_app_v1.js && node --check js/ezero_connect_chat_ui_v1.mjs && node --check tests/test_ezero_connect_chat_ui_contract_v1.mjs && node --check js/ezero_connect_identity_v1.js && node --check js/ezero_connect_invite_v1.js && node --check js/ezero_connect_trust_v1.js && node --check js/ezero_connect_trusted_reconnect_v1.mjs && node --check js/ezero_connect_trusted_friend_session_v1.mjs && node --check js/ezero_connect_rendezvous_client_v1.mjs && node --check tests/test_ezero_connect_trusted_reconnect_v1.mjs && node --check scripts/ezero_connect_qr_entry_v1.js && node --check signaling/ezero-connect-v1/worker.mjs && node --check signaling/ezero-connect-v1/rendezvous.mjs && node --check tests/test_ezero_connect_rendezvous_v1.mjs && node --check js/ezero_connect_config_v1.js && node --check js/ezero_connect_e2e_crypto_v1.mjs && node --check tests/test_ezero_connect_e2e_crypto_v1.mjs && node --check js/ezero_connect_e2e_datachannel_v1.mjs && node --check tests/test_ezero_connect_e2e_datachannel_v1.mjs && node --check js/ezero_connect_messaging_v1.mjs && node --check tests/test_ezero_connect_messaging_v1.mjs && node --check js/ezero_connect_webrtc_messaging_transport_v1.mjs && node --check js/ezero_connect_webrtc_media_call_v1.mjs && node --check js/ezero_connect_trusted_friend_call_controller_v1.mjs && node --check tests/test_ezero_connect_trusted_friend_call_controller_v1.mjs && node --check tests/test_ezero_connect_webrtc_media_call_v1.mjs && node --check tests/test_ezero_connect_webrtc_messaging_transport_v1.mjs && node --check js/ezero_connect_signaling_client_v1.js && node --check js/ezero_connect_pairing_ui_v1.js && node --check js/ezero_connect_local_profile_v1.js && node --check tests/test_ezero_connect_pairing_ui_v1.mjs && node --check tests/test_ezero_connect_signaling_v1.mjs && node --check tests/test_ezero_connect_signaling_local_v1.mjs && node --check tests/test_ezero_connect_clean_build_v1.mjs && node --check tests/test_ezero_connect_qr_runtime_v1.mjs && node --check tests/test_ezero_connect_qr_baseline_matrix_v1.mjs && node --check tests/test_ezero_connect_trust_v1.mjs
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.57.0 qr@0.7.2 esbuild@0.25.12 wrangler@4.165.0
      - name: Build locally hosted QR runtime
        run: npm run build:ezero-qr
      - name: Verify isolated QR clock-skew staging package
        run: |
          bash scripts/build_ezero_connect_qr_clock_skew_staging.sh /tmp/ezero-qr-clock-skew-staging-bundle
          test -s /tmp/ezero-qr-clock-skew-staging-bundle/js/ezero_qr_runtime_v1.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve only on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-clean-build.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ezero-connect-app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-clean-build.log
          exit 1
      - name: Test clean mobile shell behavior and no-legacy boundary
        run: node tests/test_ezero_connect_clean_build_v1.mjs
      - name: Test saved friend name retention and same-tab selection on clean UI
        run: node tests/test_ezero_connect_saved_friends_ui_v1.mjs
      - name: Test encrypted local profile and mobile editor
        run: node tests/test_ezero_connect_local_profile_v1.mjs
      - name: Verify saved-friend chat and voice UI safety contract
        run: node tests/test_ezero_connect_chat_ui_contract_v1.mjs
      - name: Start isolated local Durable Object Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'PUBLIC_ORIGIN=http://127.0.0.1:8769' > signaling/ezero-connect-v1/.dev.vars
          nohup npx wrangler dev --local --ip 127.0.0.1 --port 8787 --config signaling/ezero-connect-v1/wrangler.jsonc >/tmp/ezero-connect-worker.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then sleep 2; cat /tmp/ezero-connect-worker.log; exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-connect-worker.log
          exit 1
      - name: Verify two-browser local Worker and mutual trust relay
        run: node tests/test_ezero_connect_signaling_local_v1.mjs
      - name: Verify clean UI QR to mutual approval and saved friend flow
        run: node tests/test_ezero_connect_pairing_ui_v1.mjs
      - name: Verify QR generation and gallery-image roundtrip
        run: node tests/test_ezero_connect_qr_runtime_v1.mjs
      - name: Record pre-change QR baseline matrix (no runtime edits)
        run: node tests/test_ezero_connect_qr_baseline_matrix_v1.mjs
      - name: Upload exact QR baseline fixtures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ezero-qr-pre-change-baseline
          path: artifacts/ezero-qr-baseline/
          if-no-files-found: warn
      - name: Verify mutual approval and encrypted trusted-contact vault
        run: node tests/test_ezero_connect_trust_v1.mjs
      - name: Verify signed signaling handshake and message limits
        run: node tests/test_ezero_connect_signaling_v1.mjs
      - name: Verify E2E session handshake, encryption, replay and trust gates
        run: node tests/test_ezero_connect_e2e_crypto_v1.mjs
      - name: Verify encrypted ordered DataChannel handshake, text, voice bytes and authenticated delivery ACK
        run: node tests/test_ezero_connect_e2e_datachannel_v1.mjs
      - name: Verify trusted messaging controller, text, voice and fail-closed delivery
        run: node tests/test_ezero_connect_messaging_v1.mjs
      - name: Verify signed trusted-friend reconnect proof and fail-closed gates
        run: node tests/test_ezero_connect_trusted_reconnect_v1.mjs
      - name: Verify cryptographic trusted-friend rendezvous authorization
        run: node tests/test_ezero_connect_rendezvous_v1.mjs
      - name: Verify saved-friend reconnect to secure messaging orchestration
        run: node tests/test_ezero_connect_trusted_friend_session_v1.mjs
      - name: Verify WebRTC offer-answer negotiation and secure DataChannel attachment
        run: node tests/test_ezero_connect_webrtc_messaging_transport_v1.mjs
      - name: Verify explicit-consent WebRTC audio/video media call transport
        run: node tests/test_ezero_connect_webrtc_media_call_v1.mjs
      - name: Verify trusted saved-friend call control lifecycle and explicit acceptance
        run: node tests/test_ezero_connect_trusted_friend_call_controller_v1.mjs
      - name: Validate Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/ezero-connect-worker-dry-run --config signaling/ezero-connect-v1/wrangler.jsonc
      - name: State evidence boundary
        run: echo 'CLEAN_MOBILE_QA_AND_FAKE_WEBRTC_NEGOTIATION_ONLY_NO_LIVE_WEBRTC_NETWORK_TURN_OR_PHYSICAL_PHONE_PROOF'
