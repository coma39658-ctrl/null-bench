name: E-ZERO Connect Clean Build Shell QA

on:
  pull_request:
    paths:
      - 'ezero-connect.html'
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'js/ezero_connect_identity_v1.js'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'
  push:
    branches:
      - ezero-connect-clean-build-20261120
    paths:
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'

permissions:
  contents: read

jobs:
  clean-mobile-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check js/ezero_connect_app_v1.js && node --check js/ezero_connect_identity_v1.js && node --check tests/test_ezero_connect_clean_build_v1.mjs
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.57.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve only on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-clean-build.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ezero-connect-app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-clean-build.log
          exit 1
      - name: Test clean mobile shell behavior and no-legacy boundary
        run: node tests/test_ezero_connect_clean_build_v1.mjs
      - name: State evidence boundary
        run: echo 'CLEAN_MOBILE_UI_AND_LOCAL_DEVICE_KEY_TESTS_ONLY_NO_LIVE_QR_NO_SIGNALING_NO_PHYSICAL_PHONE_OR_CALL_PROOF'
