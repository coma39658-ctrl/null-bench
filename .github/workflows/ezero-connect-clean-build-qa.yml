  pull_request:
    paths:
      - 'ezero-connect.html'
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'js/ezero_connect_identity_v1.js'
      - 'js/ezero_connect_invite_v1.js'
      - 'js/ezero_connect_trust_v1.js'
      - 'js/ezero_connect_signal_client_v1.js'
      - 'js/ezero_connect_saved_calls_v1.js'
      - 'js/ezero_connect_media_v1.js'
      - 'js/ezero_connect_media_ui_v1.js'
      - 'js/ezero_connect_pairing_v1.js'
      - 'js/ezero_connect_pairing_ui_v1.js'
      - 'js/ezero_connect_pairing_v2.js'
      - 'js/ezero_connect_pairing_auto_ui_v2.js'
      - 'js/ezero_connect_config_v1.js'
      - 'scripts/ezero_connect_qr_entry_v1.js'
      - 'signaling/ezero-connect-v1/**'\n      - 'signaling/ezero-friendship-registry-v1/**'\n      - 'tests/test_ezero_friendship_registry_v1.mjs'
      - 'tests/test_ezero_connect_qr_frozen_guard_v1.mjs'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - 'tests/test_ezero_connect_qr_runtime_v1.mjs'
      - 'tests/test_ezero_web_scanner_controls_v1.mjs'
      - 'tests/test_ezero_connect_trust_v1.mjs'
      - 'tests/test_ezero_connect_signaling_v1.mjs'
      - 'tests/test_ezero_connect_signal_client_v1.mjs'
      - 'tests/test_ezero_connect_pairing_v1.mjs'
      - 'tests/test_ezero_connect_pairing_v2.mjs'
      - 'tests/test_ezero_connect_pairing_ui_contract_v1.mjs'
      - 'tests/test_ezero_saved_friend_call_invite_v1.mjs'
      - 'tests/test_ezero_connect_inbox_worker_v1.mjs'
      - 'tests/test_ezero_connect_saved_calls_client_v1.mjs'
      - 'tests/test_ezero_connect_live_inbox_smoke_v1.mjs'
      - 'tests/test_ezero_connect_live_call_route_v1.mjs'
      - 'tests/test_ezero_connect_media_client_v1.mjs'
      - 'tests/test_ezero_connect_media_ui_contract_v1.mjs'
      - 'package.json'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'
  push:
    branches:
      - ezero-connect-clean-build-20261120
      - ezero-connect-qr-renderer-20261120
      - ezero-web-scanner-controls-staging-20261123
      - ezero-mutual-approval-ui-staging-20261123
      - ezero-connect-auto-trust-pairing-v2-20261123
      - ezero-connect-media-foundation-v1-20261123
    paths:
      - 'ezero-connect.html'
      - 'ezero-connect-app.html'
      - 'ezero-connect.webmanifest'
      - 'js/ezero_connect_app_v1.js'
      - 'js/ezero_connect_identity_v1.js'
      - 'js/ezero_connect_invite_v1.js'
      - 'js/ezero_connect_trust_v1.js'
      - 'js/ezero_connect_signal_client_v1.js'
      - 'js/ezero_connect_saved_calls_v1.js'
      - 'js/ezero_connect_media_v1.js'
      - 'js/ezero_connect_media_ui_v1.js'
      - 'js/ezero_connect_pairing_v1.js'
      - 'js/ezero_connect_pairing_v2.js'
      - 'js/ezero_connect_pairing_auto_ui_v2.js'
      - 'js/ezero_connect_config_v1.js'
      - 'scripts/ezero_connect_qr_entry_v1.js'
      - 'signaling/ezero-connect-v1/**'
      - 'tests/test_ezero_connect_qr_frozen_guard_v1.mjs'
      - 'tests/test_ezero_connect_clean_build_v1.mjs'
      - 'tests/test_ezero_connect_qr_runtime_v1.mjs'
      - 'tests/test_ezero_web_scanner_controls_v1.mjs'
      - 'tests/test_ezero_connect_trust_v1.mjs'
      - 'tests/test_ezero_connect_signaling_v1.mjs'
      - 'tests/test_ezero_connect_signal_client_v1.mjs'
      - 'tests/test_ezero_connect_pairing_v1.mjs'
      - 'tests/test_ezero_connect_pairing_v2.mjs'
      - 'tests/test_ezero_connect_pairing_ui_contract_v1.mjs'
      - 'tests/test_ezero_saved_friend_call_invite_v1.mjs'
      - 'tests/test_ezero_connect_inbox_worker_v1.mjs'
      - 'tests/test_ezero_connect_saved_calls_client_v1.mjs'
      - 'tests/test_ezero_connect_live_inbox_smoke_v1.mjs'
      - 'tests/test_ezero_connect_live_call_route_v1.mjs'
      - 'tests/test_ezero_connect_media_client_v1.mjs'
      - 'tests/test_ezero_connect_media_ui_contract_v1.mjs'
      - 'package.json'
      - '.github/workflows/ezero-connect-clean-build-qa.yml'

permissions:
  contents: read

jobs:
  frozen-two-phone-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen call engine and QR pairing baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ezero-connect-clean-build-20261120 --depth=50
          git diff --name-only origin/ezero-connect-clean-build-20261120...HEAD > /tmp/ezero-qr-changes.txt
          if grep -E '^js/.*(webrtc|call|media|signaling)' /tmp/ezero-qr-changes.txt | grep -v -F -e 'js/ezero_connect_saved_calls_v1.js' -e 'js/ezero_connect_media_v1.js' -e 'js/ezero_connect_media_ui_v1.js'; then
            echo 'FROZEN_CALL_ENGINE_SOURCE_CHANGE_DETECTED'
            exit 1
          fi
          echo 'ONLY_NEW_ISOLATED_MEDIA_CLIENT_MODULES_ALLOWED; QR AND LEGACY CALL ENGINE SOURCES UNCHANGED'
  clean-mobile-shell:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/ezero_connect_app_v1.js
          node --check js/ezero_connect_identity_v1.js
          node --check js/ezero_connect_invite_v1.js
          node --check js/ezero_connect_trust_v1.js
          node --check js/ezero_connect_signal_client_v1.js
          node --check js/ezero_connect_saved_calls_v1.js
          node --check js/ezero_connect_media_v1.js
          node --check js/ezero_connect_media_ui_v1.js
          node --check js/ezero_connect_pairing_v1.js
          node --check js/ezero_connect_pairing_ui_v1.js
          node --check js/ezero_connect_pairing_v2.js
          node --check js/ezero_connect_pairing_auto_ui_v2.js
          node --check js/ezero_connect_config_v1.js
          node --check scripts/ezero_connect_qr_entry_v1.js
          node --check signaling/ezero-friendship-registry-v1/worker.mjs\n          node --check tests/test_ezero_friendship_registry_v1.mjs\n          node --check signaling/ezero-connect-v1/worker.mjs
          node --check signaling/ezero-connect-v1/inbox_worker.mjs
          node --check signaling/ezero-connect-v1/inbox_protocol.mjs
          node --check signaling/ezero-connect-v1/saved_friendship_authorization_v1.mjs
          node --check tests/test_ezero_saved_friendship_authorization_v1.mjs
          node --check tests/test_ezero_connect_qr_frozen_guard_v1.mjs
          node --check tests/test_ezero_connect_clean_build_v1.mjs
          node --check tests/test_ezero_connect_qr_runtime_v1.mjs
          node --check tests/test_ezero_web_scanner_controls_v1.mjs
          node --check tests/test_ezero_connect_trust_v1.mjs
          node --check tests/test_ezero_connect_signaling_v1.mjs
          node --check tests/test_ezero_connect_signal_client_v1.mjs
          node --check tests/test_ezero_connect_pairing_v1.mjs
          node --check tests/test_ezero_connect_pairing_v2.mjs
          node --check tests/test_ezero_connect_pairing_ui_contract_v1.mjs
          node --check tests/test_ezero_saved_friend_call_invite_v1.mjs
          node --check tests/test_ezero_connect_inbox_worker_v1.mjs
          node --check tests/test_ezero_connect_saved_calls_client_v1.mjs
          node --check tests/test_ezero_connect_live_inbox_smoke_v1.mjs
          node --check tests/test_ezero_connect_live_call_route_v1.mjs
          node --check tests/test_ezero_connect_media_client_v1.mjs
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-audit --no-fund --ignore-scripts playwright@1.57.0 qr@0.7.2 esbuild@0.25.12 wrangler@4.165.0
      - name: Build locally hosted QR runtime
        run: npm run build:ezero-qr
      - name: Validate Worker bundle and migrations without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/ezero-connect-worker-dry-run --config signaling/ezero-connect-v1/wrangler.jsonc
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve only on loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8769 --bind 127.0.0.1 >/tmp/ezero-clean-build.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ezero-connect-app.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-clean-build.log
          exit 1
      - name: Enforce immutable QR and trusted-friend pairing baseline
        run: node tests/test_ezero_connect_qr_frozen_guard_v1.mjs
      - name: Test clean mobile shell behavior and no-legacy boundary
        run: node tests/test_ezero_connect_clean_build_v1.mjs
      - name: Verify QR generation and gallery-image roundtrip
        run: node tests/test_ezero_connect_qr_runtime_v1.mjs
      - name: Verify full-screen mobile scanner, camera switch, torch gating and gallery control
        run: node tests/test_ezero_web_scanner_controls_v1.mjs
      - name: Verify mutual approval and encrypted trusted-contact vault
        run: node tests/test_ezero_connect_trust_v1.mjs
      - name: Verify signed signaling handshake and message limits
        run: node tests/test_ezero_connect_signaling_v1.mjs
      - name: Verify browser signaling client handshake and send allowlist
        run: node tests/test_ezero_connect_signal_client_v1.mjs
      - name: Verify legacy v1 approval protocol remains isolated
        run: node tests/test_ezero_connect_pairing_v1.mjs
      - name: Verify automatic v2 trusted-friend pairing session
        run: node tests/test_ezero_connect_pairing_v2.mjs
      - name: Verify automatic pairing UI contract
        run: node tests/test_ezero_connect_pairing_ui_contract_v1.mjs
      - name: Verify signed saved-friend call invitation validation
        run: node tests/test_ezero_saved_friend_call_invite_v1.mjs
      - name: Verify inbox routing and offline behavior
        run: node tests/test_ezero_connect_inbox_worker_v1.mjs
      - name: Verify server-authoritative saved-friend call authorization
        run: node tests/test_ezero_saved_friendship_authorization_v1.mjs
      - name: Verify saved-friend browser identity and inbox client
        run: node tests/test_ezero_connect_saved_calls_client_v1.mjs
      - name: Verify foreground media call controls and accepted-room handoff
        run: node tests/test_ezero_connect_media_client_v1.mjs
      - name: Verify live staging Worker health, literal inbox route and signed browser authentication
        run: node tests/test_ezero_connect_live_inbox_smoke_v1.mjs
      - name: Verify live two-device inbox, signed call invite, accept and room relay
        run: node tests/test_ezero_connect_live_call_route_v1.mjs
      - name: State evidence boundary
        run: echo 'AUTOMATED_CONTRACTS_ONLY_NO_PHYSICAL_TWO_PHONE_CALL_OR_ANDROID_BACKGROUND_RING_PROOF'
