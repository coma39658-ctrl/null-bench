name: E-ZERO Android Keystore Enrollment Client Staging QA

on:
  push:
    branches:
      - ezero-android-keystore-enrollment-client-staging-20261125
    paths:
      - "android/app/src/main/java/com/ezero/connect/AndroidEnrollmentKeyStore.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidEnrollmentProtocolV1.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidEnrollmentQrEnvelopeV1.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidQrPayloadRouter.kt"
      - "android/app/src/main/java/com/ezero/connect/AndroidSignatureEncoding.kt"
      - "android/app/src/main/java/com/ezero/connect/MainActivity.kt"
      - "android/app/src/main/java/com/ezero/connect/QrCameraScanActivity.kt"
      - "android/app/src/test/java/com/ezero/connect/AndroidEnrollmentProtocolV1Test.kt"
      - "android/app/src/test/java/com/ezero/connect/AndroidEnrollmentQrEnvelopeV1Test.kt"
      - "android/app/src/test/java/com/ezero/connect/AndroidQrPayloadRouterTest.kt"
      - "tests/ezero_android_enrollment_qr_envelope_v1.test.mjs"
      - "tests/ezero_android_keystore_enrollment_client_v1.test.mjs"
      - ".github/workflows/ezero-android-keystore-enrollment-client-staging-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-enrollment-client-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Android enrollment source safeguards
        run: node --test tests/ezero_android_keystore_enrollment_client_v1.test.mjs tests/ezero_android_enrollment_qr_envelope_v1.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Assemble isolated Android staging debug APK
        run: gradle -p android :app:assembleDebug
