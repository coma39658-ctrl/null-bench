name: E-ZERO saved-friend isolated contract QA
on:
  push:
    branches:
      - ezero-secure-simple-home-ui-stage-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify saved-friend and QR baseline source contracts
        run: node tests/ezero_saved_friend_no_repeat_qr_contract_20261113.cjs
      - name: Verify simplified multilingual home source contracts
        run: node tests/ezero_simple_home_staging_contract_20261113.cjs
