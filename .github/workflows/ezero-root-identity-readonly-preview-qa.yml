name: E-ZERO Root Identity Read-only Preview QA

on:
  pull_request:
    paths:
      - "staging/ezero-root-public-identity.html"
      - "staging/js/ezero_connect_identity_v1.js"
      - "tests/ezero_root_identity_readonly_preview.test.cjs"
      - ".github/workflows/ezero-root-identity-readonly-preview-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check identity module
        run: node --check staging/js/ezero_connect_identity_v1.js
      - name: Verify read-only page contract
        run: node tests/ezero_root_identity_readonly_preview.test.cjs
