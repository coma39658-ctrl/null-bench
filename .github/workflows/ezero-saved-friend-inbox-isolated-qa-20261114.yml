name: E-ZERO Saved Friend Inbox Isolated QA
on:
  push:
    branches:
      - ezero-saved-friend-inbox-isolated-20261114
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saved-friend-browser-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch (no credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check trusted inbox UI and static safety contracts
        run: |
          node --check tests/test_ezero_saved_friend_inbox_simulated_20261114.mjs
          node --check js/ezero_trusted_friend_foreground_client_candidate_v0_1.js
          node --check signaling/cloudflare/src/trusted_inbox_candidate_v0_1.js
          node --test tests/test_ezero_render_inbox_browser_integration_contract_20261111.cjs
          node --test tests/test_ezero_qr_close_video_swap_static_20261113.cjs
      - name: Verify production-style Render bundle leaves inbox disabled
        run: |
          python3 scripts/build_ezero_secure_app_render_staging_20261107.py
          node -e 'const s=require("node:fs").readFileSync("dist_ezero_secure_app_two_phone_staging/js/ezero_trusted_inbox_stage_config_20261106.js","utf8");if(!s.includes("enabled:false")||s.includes("enabled:true"))process.exit(1);console.log("RELEASE_INBOX_REMAINS_DISABLED: PASS")'
      - name: Install isolated Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.57.0 ws@8.18.3
          npx playwright install --with-deps chromium
      - name: Start localhost preview
        run: |
          nohup python3 -m http.server 8769 --bind 127.0.0.1 > /tmp/ezero-inbox-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8769/ezero_trusted_friends_staging_20261106.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ezero-inbox-browser.log
          exit 1
      - name: Simulated opt-in inbox and explicit incoming acceptance
        run: node tests/test_ezero_saved_friend_inbox_simulated_20261114.mjs
      - name: Preserve frozen QR/video baseline
        run: |
          node tests/test_ezero_contact_first_call_20261106.mjs
          node tests/test_ezero_gallery_repeat_isolated_20261114.mjs
