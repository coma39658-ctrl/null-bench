    <path d="M81 238l8 8 13-15" stroke-width="2.6"/>
    <circle cx="118" cy="211" r="3"/>
    <!-- Friendly message and safe conversation -->
    <path d="M239 234a22 17 0 0 1 22-17h26a22 17 0 0 1 22 17v8a22 17 0 0 1-22 17h-12l-12 10v-10h-2a22 17 0 0 1-22-17z"/>
    <circle cx="259" cy="240" r="2" fill="#2e8d9a"/>
    <circle cx="273" cy="240" r="2" fill="#2e8d9a"/>
    <circle cx="287" cy="240" r="2" fill="#2e8d9a"/>
    <!-- Constellation of exploration -->
    <circle cx="127" cy="357" r="4" fill="#2e8d9a"/>
    <circle cx="154" cy="329" r="3"/>
    <circle cx="179" cy="360" r="5"/>
    <circle cx="214" cy="349" r="3"/>
    <circle cx="200" cy="390" r="3"/>
    <path d="M127 357l27-28 25 31 35-11m-35 11l21 30" stroke-dasharray="3 6"/>
    <!-- Upward growth, not a monetary promise -->
    <path d="M29 438l19-18 16 6 27-28m-13 0h13v13"/>
    <path d="M265 415a25 25 0 1 0 42 20m-6-27l6-4 5 5"/>
