    <ellipse cx="90" cy="80" rx="47" ry="20" transform="rotate(-25 90 80)"/>
    <ellipse cx="90" cy="80" rx="47" ry="20" transform="rotate(30 90 80)"/>
    <circle cx="90" cy="80" r="10"/>
    <circle cx="90" cy="80" r="3" fill="#2e8d9a"/>
    <path d="M137 60l8-4m-12 1l2-9m-13 78l-8 10"/>
    <!-- Three peers and an open central network -->
