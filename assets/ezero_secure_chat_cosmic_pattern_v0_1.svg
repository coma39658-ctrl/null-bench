    <circle cx="320" cy="62" r="8"/>
    <circle cx="323" cy="127" r="9"/>
    <path d="M288 86l25-19m-23 16l28 34m-13-48l3 46" stroke-dasharray="3 5"/>
    <path d="M276 80a17 17 0 0 1 18 14m31 35l9 0"/>
