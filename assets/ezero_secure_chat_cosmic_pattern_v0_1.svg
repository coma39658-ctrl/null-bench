<svg xmlns="http://www.w3.org/2000/svg" width="390" height="480" viewBox="0 0 390 480" role="img" aria-label="E-ZERO original cosmic trust motifs">
  <title>E-ZERO original cosmic trust and discovery pattern</title>
  <desc>Subtle decorative interconnected orbits, small constellations, a shield, rays of discovery, collaborative circles and growth arrows. No identifying data or text.</desc>
  <g fill="none" stroke="#2e8d9a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".23">
