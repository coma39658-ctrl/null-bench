    <path d="M335 309v-13m-6 7h12m-6-7l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M34 302v-8m-4 4h8"/>
    <path d="M199 174v-9m-4 4h8"/>
  </g>
  <!-- Soft secondary signals, intentionally low contrast -->
  <g fill="#41a7a7" opacity=".11">
    <circle cx="45" cy="156" r="2.5"/><circle cx="177" cy="230" r="3"/>
    <circle cx="359" cy="177" r="3"/><circle cx="337" cy="358" r="2.5"/>
    <circle cx="32" cy="357" r="3"/><circle cx="234" cy="25" r="2.5"/>
